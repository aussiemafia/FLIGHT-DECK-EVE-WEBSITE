(() => {
 const feed=document.getElementById('stationFeed'),video=feed.querySelector('video'),label=feed.querySelector('span');
 const select=document.createElement('select');select.setAttribute('aria-label','Project a record');feed.append(select);
 const note=document.createElement('p');feed.append(note);
 let activeRoute='',current='';
 function show(key,notify){
   if(!Object.hasOwn(exhibitPlates,key))return;
   current=key;const item=mountExhibit(feed,key,'../');
   item.style.cssText='width:min(42vw,640px);height:clamp(120px,22vw,260px);object-fit:contain';
   if(item.tagName==='VIDEO'&&!document.hidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches)item.play().catch(()=>{});
   label.textContent=exhibitPlates[key][0];note.textContent=recordPages(key,activeRoute)[0];
   select.value=key;
   if(notify&&parent!==window)parent.postMessage({stationExhibit:key},location.origin);
 }
 window.selectExhibit=key=>show(key,true);
 select.onchange=()=>show(select.value,true);
 document.addEventListener('click',e=>{
   const hull=e.target.closest('[data-project-ship]');if(hull)show(hull.dataset.projectShip,true);
   const summary=e.target.closest('details[data-encounter] > summary');
   if(summary){const [cls,name]=summary.parentElement.dataset.encounter.split('|');show('site-'+cls.toLowerCase()+'-'+name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),true)}
 });
 document.addEventListener('change',e=>{if(e.target.id==='buyerItem')show(e.target.value.match(/^\d+$/)?'type-'+e.target.value:'loot',true)});
 function sync(){
   const route=document.body.dataset.view;
   if(route===activeRoute)return;
   activeRoute=route;feed.hidden=!route||route==='home';if(feed.hidden)return;
   video.hidden=true;video.pause();
   const chosen=new URLSearchParams(location.search).get('exhibit');
   const key=Object.hasOwn(exhibitPlates,chosen)&&(exhibitPlates[chosen][1]===route||chosen===routePlate(route))?chosen:routePlate(route);
   const related=({audit:'sites',guides:'sites',reference:'estimate'})[route]||route;
   const keys=Object.keys(exhibitPlates).filter(k=>[route,related].includes(exhibitPlates[k][1]));if(!keys.includes(key))keys.unshift(key);
   select.replaceChildren(...keys.map(k=>new Option(exhibitPlates[k][0],k)));select.hidden=keys.length<2;
   if(route==='fits'&&key.startsWith('fit-')){
     const [,hull,variant]=key.split('-');const match=Object.keys(A.fits).find(h=>h.toLowerCase()===hull);
     if(match&&A.fits[match][variant]){fitHull=match;fitKey=variant;fits()}
   }
   if(route==='fits'&&(key==='fit'||key.startsWith('fit-'))&&chosen!=='fit'&&!chosen){show(fitHull==='Loki'?'ship-29990':'fit-'+fitHull.toLowerCase()+'-'+fitKey,true)}
   else show(key,true);
 }
 new MutationObserver(sync).observe(document.body,{attributes:true,attributeFilter:['data-view']});sync();
})();
