<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Eden course library</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#121e24;color:#f4efe4;font:16px/1.55 system-ui}main{max-width:1050px;margin:auto;padding:clamp(16px,4vw,48px)}h1{font:normal clamp(32px,5vw,56px)/1.1 Georgia,serif;margin:0 0 8px}a{color:#a3e4dc}p{margin:.45rem 0 1rem}label{display:block}input{width:100%;padding:11px;color:inherit;border:1px solid #718080;background:#1c3035;border-radius:5px;font:inherit}section{margin:32px 0}h2{font-size:20px;color:#efd3a0;border-bottom:1px solid #496268;padding-bottom:6px}details{border-bottom:1px solid #394b52;padding:10px 0}summary{font-weight:600;cursor:pointer}details p{max-width:70ch;margin:12px 0}article{padding:0 1rem .75rem;border-left:2px solid #c4a976}.refs{display:flex;flex-wrap:wrap;gap:18px;margin-top:24px}b{color:#c6e4dd}
</style></head><body><main><a href="index.html" target="_top">Return to campus</a><h1>New Eden course library</h1><p>Choose a subject, then try the exercise in your client.</p><label>Find a subject<input type="search" id="search" placeholder="Try exploration, hauling or fleet support"></label><div id="subjects"></div><p id="empty" hidden>No matching subject. Try a ship role or career name.</p><footer class="refs"><a href="https://wiki.eveuniversity.org/Main_Page" target="_blank" rel="noopener">Browse the EVE University Wiki</a><a href="https://support.eveonline.com/hc/en-us/articles/5194673685148-AIR-Career-Program" target="_blank" rel="noopener">AIR Career Program</a></footer></main><script src="course-data.js"></script><script>
const host=document.querySelector('#subjects');
for(const [area,guide,courses] of campusSubjects){
 const section=document.createElement('section'),title=document.createElement('h2');title.textContent=area;section.append(title);
 for(const [name,lesson,task] of courses){
  const entry=document.createElement('details'),label=document.createElement('summary'),body=document.createElement('article');
  label.textContent=name;const p=document.createElement('p'),exercise=document.createElement('p'),b=document.createElement('b');
  p.textContent=lesson;b.textContent='In the client · ';exercise.append(b,task);body.append(p,exercise);entry.append(label,body);section.append(entry);
 }
 const source=document.createElement('a');source.href='https://www.eveonline.com/eve-academy/careers/'+guide;source.textContent='Continue at CCP’s EVE Academy';source.target='_blank';source.rel='noopener';section.append(source);host.append(section);
}
document.querySelector('#search').oninput=e=>{
 const query=e.target.value.trim().toLowerCase();let count=0;
 for(const section of host.children){
  let hits=0;const category=section.firstElementChild.textContent.toLowerCase();
  for(const entry of section.querySelectorAll('details')){
   entry.hidden=!(category+' '+entry.textContent.toLowerCase()).includes(query);if(!entry.hidden)hits++;
  }
  section.hidden=!hits;count+=hits;
 }
 document.querySelector('#empty').hidden=!!count;
};
const area=new URLSearchParams(location.search).get('subject');
if(area){const search=document.querySelector('#search');search.value=area;search.dispatchEvent(new Event('input'));}
</script></body></html>
