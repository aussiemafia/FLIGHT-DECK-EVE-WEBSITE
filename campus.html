<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Eden course library</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#121e24;color:#f4efe4;font:16px/1.55 system-ui}main{max-width:1050px;margin:auto;padding:clamp(16px,4vw,48px)}h1{font:normal clamp(32px,5vw,56px)/1.1 Georgia,serif;margin:0 0 8px}a{color:#a3e4dc}p{margin:.45rem 0 1rem}label{display:block}input{width:100%;padding:11px;color:inherit;border:1px solid #718080;background:#1c3035;border-radius:5px;font:inherit}section{margin:32px 0}h2{font-size:20px;color:#efd3a0;border-bottom:1px solid #496268;padding-bottom:6px}details{border-bottom:1px solid #394b52;padding:10px 0}summary{font-weight:600;cursor:pointer}details p{max-width:70ch;margin:12px 0}article{padding:0 1rem .75rem;border-left:2px solid #c4a976}.refs{display:flex;flex-wrap:wrap;gap:18px;margin-top:24px}b{color:#c6e4dd}
</style></head><body><main><h1>New Eden course library</h1><p>Choose a subject, then try the exercise in your client.</p><label>Find a subject<input type="search" id="search" placeholder="Try exploration, hauling or fleet support"></label><div id="subjects"></div><p id="empty" hidden>No matching subject. Try a ship role or career name.</p><footer class="refs"><a href="https://wiki.eveuniversity.org/Main_Page" target="_blank" rel="noopener">Browse the EVE University Wiki</a><a href="https://support.eveonline.com/hc/en-us/articles/5194673685148-AIR-Career-Program" target="_blank" rel="noopener">AIR Career Program</a></footer></main><script>
const subjects=[
['Flight school','explorer',[
['First undock and navigation','Set a nearby station as your destination. Gates connect star systems. Warping moves you between locations inside one system.','Plot a route, inspect the security status of each jump and identify the station where you will dock.'],
['Ships, skills and fitting','Read the hull bonuses before buying modules. CPU and powergrid limit what fits, while capacitor powers active modules in flight.','Simulate a fitting. Compare two propulsion modules and inspect the effect on fitting resources and capacitor.']]],
['Exploration and cartography','explorer',[
['Probe scanning and hacking','Core scanner probes resolve cosmic signatures. Relic and data analyzers interact with the corresponding containers.','Pinpoint a signature, identify its site type and check that your analyzer matches before travelling to it.'],
['Wormhole navigation','A wormhole bookmark marks a location in one system. The return connection is a separate location on the far side.','Name and save both ends of a connection. Read its remaining lifetime and mass description.'],
['Directional scanning','Directional scan samples objects within a selected angle and range. A narrow cone helps associate a result with a particular direction.','Scan a known nearby ship at a wide angle, then narrow the cone and repeat.']]],
['Industry and commerce','industrialist',[
['Mining, ice and hauling','A mining trip includes travel, harvesting and unloading. A large yield per cycle can still mean frequent return trips.','Time one complete trip. Divide the amount delivered by the total time, including travel.'],
['Blueprints and manufacturing','A blueprint lists the inputs for a production run. A job quote includes costs beyond the material list.','Preview one run. Add material purchases, installation and selling costs before comparing the local sale price.'],
['Markets and trade routes','Buy and sell orders show different prices, locations and volumes. A high price in another system also involves a hauling decision.','Compare two stations for one item. Check the order quantity, minimum volume and route before choosing a sale.'],
['Planetary industry','Planetary colonies link extraction, storage, processing and export. A route tells the colony where a commodity should go.','Trace one product from an extractor through a processor to a launchpad. Check which inputs the processor needs.'],
['Salvage and reprocessing','Looting a wreck takes its cargo. Salvaging recovers materials from the wreck itself. Reprocessing converts eligible items into other materials.','Inspect a wreck and compare the items you loot with the materials from a successful salvage cycle.']]],
['Combat and missions','enforcer',[
['Agents, missions and standings','An agent offer identifies the task, destination and rewards. Missions can involve combat, hauling or other work.','Read a mission briefing before accepting. Identify the objective item or target and the return destination.'],
['Damage, range and tank','Damage application depends on the weapon and target. Resistances matter when deciding how to defend against incoming damage.','In simulation, compare two ammunition types. Check the change in range, damage and damage type.'],
['Abyssal Deadspace','An Abyssal run has environmental effects and a shared time limit. A fit must handle the pockets and reach the exit in time.','Read a filament description. Identify the weather and ship restrictions before deciding whether the fit belongs there.']]],
['Fleet operations and PvP','soldier-of-fortune',[
['Tackle and range control','Tackle pilots prevent opponents from warping. A disruptor and a scrambler have different ranges and effects.','Compare both modules in Show Info. Find the activation range and the effect on a target using a microwarpdrive.'],
['Logistics and fleet broadcasts','Logistics pilots repair fleetmates remotely. A useful repair depends on the broadcast, the repair type and the distance to the target.','In a practice fleet, broadcast for shields or armour. Have the logistics pilot identify you in broadcast history.'],
['Faction warfare','Faction warfare brings opposing militias into contested systems. Complexes have entry restrictions that affect ship choice.','Inspect a warzone and a complex gate. Check whether your hull qualifies before committing to the fight.'],
['Corporations, fleets and roles','A fleet has its own hierarchy and broadcasts. A corporation has membership, standings and permissions that persist beyond one fleet.','Open a practice fleet, locate the fleet commander and identify where destination and repair broadcasts appear.']]]
];
const host=document.querySelector('#subjects');
for(const [area,guide,courses] of subjects){
 const section=document.createElement('section'),title=document.createElement('h2');title.textContent=area;section.append(title);
 for(const [name,lesson,task] of courses){
  const entry=document.createElement('details'),label=document.createElement('summary'),body=document.createElement('article');
  label.textContent=name;const p=document.createElement('p'),exercise=document.createElement('p'),b=document.createElement('b');
  p.textContent=lesson;b.textContent='In the client · ';exercise.append(b,task);body.append(p,exercise);entry.append(label,body);section.append(entry);
 }
 const source=document.createElement('a');source.href='https://www.eveonline.com/eve-academy/careers/'+guide;source.textContent='Continue at CCP’s EVE Academy';source.target='_blank';source.rel='noopener';section.append(source);host.append(section);
}
document.querySelector('#search').oninput=e=>{
 const query=e.target.value.trim().toLowerCase();let count=0;
 for(const section of host.children){
  let hits=0;const category=section.firstElementChild.textContent.toLowerCase();
  for(const entry of section.querySelectorAll('details')){
   entry.hidden=!(category+' '+entry.textContent.toLowerCase()).includes(query);if(!entry.hidden)hits++;
  }
  section.hidden=!hits;count+=hits;
 }
 document.querySelector('#empty').hidden=!!count;
};
</script></body></html>
