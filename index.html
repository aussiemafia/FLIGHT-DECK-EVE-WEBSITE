<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ece5d8"><title>Grand Concourse · The Expanse</title><link rel="stylesheet" href="concourse.css?v=crew-lounge-6"></head>
<body>
<main id="viewport" tabindex="0" aria-label="Walkable grand concourse"><div id="camera"><div id="hall"></div></div></main>
<header><div class="brand"><i aria-hidden="true">✦</i><span>THE EXPANSE<small>AMARR AVATAR TITAN</small></span></div><nav><span id="crew-status">Connecting crew</span><button id="directory">Deck directory</button><button id="main-bridge">Flight bridge</button></nav></header>
<div class="intercom-controls"><details class="sound-desk"><summary>Sound &amp; radio</summary><label>Station volume <input id="master-gain" type="range" min="0" max="100" value="70"></label><button id="music">Play lounge music</button><button id="voice-join">Join nearby voice</button><button id="mute-pilots">Mute pilots</button></details><button id="ptt" aria-pressed="false">Hold V to talk</button><span id="radio-status" role="status">Radio off</span><button id="intercom">Ship intercom</button><button id="quiet">Mute voice</button></div><p id="announcement" role="status" hidden></p><button id="elevator" hidden>Ride lift</button><button id="rise" hidden>Stand up · E</button><div id="aim" aria-hidden="true"></div><button id="interact" hidden></button>
<footer><div class="location"><small>PUBLIC DECK</small><strong>Grand Concourse</strong></div><div class="controls"><span><kbd>WASD</kbd> Walk</span><span><kbd>Shift</kbd> Run</span><span>Drag to look</span><span><kbd>E</kbd> Interact</span></div></footer>
<div id="pad" aria-label="Movement controls"><button data-key="KeyW" aria-label="Walk forward">▲</button><div><button data-key="KeyA" aria-label="Move left">◀</button><button data-key="KeyS" aria-label="Walk backward">▼</button><button data-key="KeyD" aria-label="Move right">▶</button></div></div>
<button id="lesson-launch" hidden>Listen &amp; watch</button>
<dialog id="lesson-panel"><div class="bar"><h2 id="lesson-title"></h2><button id="lesson-close">Return to room</button></div>
<video id="lesson-film" muted playsinline loop controls></video><audio id="lesson-audio" controls></audio>
<p id="lesson-copy"></p><strong id="lesson-question"></strong><div id="lesson-answers"></div><p id="lesson-feedback" role="status"></p><button id="lesson-archive">Open the subject archive</button></dialog><dialog id="menu"><div class="bar"><h1>Deck directory</h1><button data-close aria-label="Close directory">✕</button></div><small id="render-mode">Compatibility renderer</small><label class="sky-select">Exterior view <select id="outside"><option>Aurora Reach</option><option>Amarr dusk</option><option>Blue Meridian</option></select></label><label class="sky-select">Pilot uniform <select id="uniform"><option value="imperial">Amarr-inspired officer · female</option><option value="tribal">Minmatar-inspired officer · male</option></select></label><div id="destinations"></div></dialog>
<dialog id="record"><div class="bar"><h2 id="record-title"></h2><button data-close>Back to concourse</button></div><iframe title="EVE station archive"></iframe></dialog>
<script src="concourse.js?v=crew-lounge-6"></script><link rel="stylesheet" href="crew.css?v=crew-lounge-6"><script src="city.js?v=crew-lounge-6"></script><script src="helm.js?v=crew-lounge-6"></script><script src="atmosphere.js?v=crew-lounge-6"></script><script src="pilot-renderer.js?v=crew-lounge-6"></script><script src="nearby-voice.js"></script><script src="crew.js?v=crew-lounge-6"></script><script src="conservatory.js?v=crew-lounge-6"></script><script src="interaction.js?v=crew-lounge-6"></script><script src="intercom.js?v=crew-lounge-6"></script><script src="station-audio.js"></script><script src="lessons.js"></script><script src="salon.js"></script><script src="cinema.js"></script><script type="module" src="ship-game.mjs?v=crew-lounge-6"></script></body></html>
